<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071610" />
    <meta name="description" content="Jungle Evolve — a zero-dependency 3D eat-to-evolve browser game." />
    <title>Jungle Evolve</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eaffdf;
        --muted: #9ab69a;
        --panel: rgba(5, 20, 13, 0.76);
        --panel-strong: rgba(5, 20, 13, 0.92);
        --line: rgba(190, 255, 164, 0.22);
        --lime: #b7ff72;
        --mint: #5ee8a0;
        --amber: #ffd27a;
        --danger: #ff946e;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #06140e;
      }

      body {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
      }

      button {
        font: inherit;
        color: inherit;
      }

      #game {
        position: fixed;
        inset: 0;
        isolation: isolate;
      }

      #glcanvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #071d13;
        touch-action: none;
        user-select: none;
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(3, 12, 8, 0.64), transparent 25%, transparent 70%, rgba(3, 12, 8, 0.78)),
          radial-gradient(ellipse at center, transparent 48%, rgba(2, 10, 7, 0.62) 100%);
        z-index: 1;
      }

      #hud {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 26px;
      }

      .brand {
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }

      .eyebrow {
        display: block;
        color: var(--mint);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 5px 0 0;
        font-size: clamp(22px, 3vw, 36px);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stat {
        min-width: 92px;
        padding: 9px 11px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .stat-value {
        display: block;
        margin-top: 3px;
        color: var(--lime);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .progress-card {
        position: absolute;
        left: 26px;
        bottom: 28px;
        width: min(320px, calc(100vw - 52px));
        padding: 14px 15px 15px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #progress-copy { color: var(--muted); }
      #progress-value { color: var(--lime); }

      .progress-track {
        height: 7px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(210, 255, 191, 0.1);
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--mint), var(--lime));
        box-shadow: 0 0 18px rgba(183, 255, 114, 0.4);
        transition: width 180ms ease-out;
      }

      .tip {
        position: absolute;
        right: 26px;
        bottom: 30px;
        max-width: min(380px, calc(100vw - 380px));
        color: rgba(234, 255, 223, 0.88);
        font-size: 12px;
        line-height: 1.45;
        text-align: right;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.72);
      }

      .pause-button {
        position: absolute;
        top: 26px;
        left: 50%;
        min-width: 70px;
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(5, 20, 13, 0.55);
        color: var(--muted);
        cursor: pointer;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transform: translateX(-50%);
        pointer-events: auto;
        transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .pause-button:hover {
        border-color: rgba(190, 255, 164, 0.5);
        background: rgba(10, 37, 22, 0.84);
        color: var(--ink);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(2, 11, 7, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
        z-index: 4;
      }

      .overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .modal {
        width: min(530px, 100%);
        padding: clamp(24px, 5vw, 42px);
        border: 1px solid rgba(190, 255, 164, 0.3);
        border-radius: 25px;
        background: linear-gradient(145deg, rgba(10, 34, 21, 0.96), rgba(3, 15, 10, 0.95));
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        text-align: center;
      }

      .modal-kicker {
        color: var(--mint);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .modal h2 {
        margin: 9px 0 12px;
        font-size: clamp(32px, 8vw, 62px);
        line-height: 0.92;
        letter-spacing: -0.08em;
      }

      .modal p {
        margin: 0 auto;
        max-width: 390px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
        margin: 24px auto 25px;
        max-width: 360px;
      }

      .control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid rgba(190, 255, 164, 0.12);
        border-radius: 10px;
        background: rgba(190, 255, 164, 0.05);
        color: var(--muted);
        font-size: 11px;
        text-align: left;
      }

      kbd {
        padding: 3px 7px;
        border: 1px solid rgba(190, 255, 164, 0.26);
        border-bottom-width: 2px;
        border-radius: 6px;
        color: var(--ink);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }

      .primary {
        min-width: 180px;
        padding: 13px 20px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(100deg, #7be8a6, #c7ff73);
        color: #092016;
        cursor: pointer;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 0 9px 24px rgba(130, 236, 145, 0.2);
        transition: transform 160ms ease, filter 160ms ease;
      }

      .primary:hover {
        filter: brightness(1.08);
        transform: translateY(-2px);
      }

      .secondary {
        display: block;
        margin: 14px auto 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
      }

      .secondary:hover { color: var(--ink); }

      .evolution-banner {
        position: absolute;
        top: 21%;
        left: 50%;
        min-width: min(440px, calc(100vw - 40px));
        padding: 17px 24px;
        border: 1px solid rgba(199, 255, 115, 0.4);
        border-radius: 16px;
        background: rgba(10, 39, 24, 0.86);
        box-shadow: 0 0 45px rgba(183, 255, 114, 0.14);
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -10px) scale(0.97);
        transition: opacity 180ms ease, transform 180ms ease;
        z-index: 3;
      }

      .evolution-banner.show {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .evolution-banner strong {
        display: block;
        color: var(--lime);
        font-size: 22px;
        letter-spacing: -0.04em;
      }

      .evolution-banner span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .error-copy { color: var(--danger) !important; }

      @media (max-width: 700px) {
        .topbar { padding: 16px; }
        .stats { gap: 5px; }
        .stat { min-width: 73px; padding: 7px 8px; }
        .stat-value { font-size: 14px; }
        .progress-card { left: 16px; bottom: 16px; width: min(290px, calc(100vw - 32px)); }
        .tip { right: 16px; bottom: 106px; max-width: calc(100vw - 32px); font-size: 11px; }
        .pause-button { top: 17px; left: auto; right: 16px; transform: none; }
        .controls { grid-template-columns: 1fr; margin-top: 20px; }
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Jungle Evolve game">
      <canvas id="glcanvas" aria-label="3D jungle game canvas"></canvas>
      <div id="vignette"></div>

      <section id="hud" aria-live="polite">
        <header class="topbar">
          <div class="brand">
            <span class="eyebrow">Eat · Adapt · Rule</span>
            <h1>JUNGLE EVOLVE</h1>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Form</span>
              <span id="stage-value" class="stat-value">幼兽</span>
            </div>
            <div class="stat">
              <span class="stat-label">Eaten</span>
              <span id="eaten-value" class="stat-value">0 / 24</span>
            </div>
            <div class="stat">
              <span class="stat-label">Time</span>
              <span id="time-value" class="stat-value">00:00</span>
            </div>
          </div>
        </header>

        <aside class="progress-card">
          <div class="progress-head">
            <span id="progress-copy">Evolution path</span>
            <span id="progress-value">幼兽 · 0%</span>
          </div>
          <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
        </aside>

        <div id="tip" class="tip">W / ↑ 前进 · S / ↓ 后退 · A D / ← → 转向</div>
        <button id="pause-button" class="pause-button" type="button">Pause</button>
      </section>

      <section id="overlay" class="overlay visible" aria-modal="true" role="dialog">
        <div class="modal">
          <div class="modal-kicker">A 3D eat-to-evolve experiment</div>
          <h2 id="modal-title">JUNGLE<br />EVOLVE</h2>
          <p id="modal-copy">从一只幼兽开始，在有雾的丛林里吞噬比你小的动物。每一次吞噬都会让你更大、更快，直到成为这片树冠的统治者。</p>
          <div class="controls">
            <div class="control"><span>前进 / 后退</span><kbd>W S / ↑ ↓</kbd></div>
            <div class="control"><span>转向</span><kbd>A D / ← →</kbd></div>
            <div class="control"><span>暂停</span><kbd>P</kbd></div>
            <div class="control"><span>吞噬</span><kbd>靠近即可</kbd></div>
          </div>
          <button id="start-button" class="primary" type="button">Enter the jungle</button>
          <button id="restart-button" class="secondary" type="button" hidden>再来一局</button>
        </div>
      </section>

      <div id="evolution-banner" class="evolution-banner" aria-live="assertive">
        <strong id="evolution-title">已进化</strong>
        <span id="evolution-subtitle">Your body adapts</span>
      </div>
    </main>
    <script src="./game.js" defer></script>
  </body>
</html>
